[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_ENABLE_STD_STRING=0
lib_deps =
  bblanchon/ArduinoJson @ 7.4.2
  knolleary/PubSubClient @ 2.8
  claws/BH1750 @ 1.3.0
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit Unified Sensor @ 1.1.15
  adafruit/Adafruit BusIO @ 1.17.2
  adafruit/DHT sensor library @ 1.4.6
  adafruit/Adafruit INA219 @ 1.2.3
  adafruit/Adafruit MAX31865 library @ 1.6.2
  adafruit/Adafruit ADS1X15 @ 2.5.0
  lewapek/Nova Fitness Sds dust sensors library @ 1.5.1
  https://github.com/sparkfun/SparkFun_AS3935_Lightning_Detector_Arduino_Library/archive/refs/tags/v1.4.9.zip
